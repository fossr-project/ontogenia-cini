# Mock KEAC submission — API-based mode.
# Fields follow the challenge-catalog PR template
# (codeberg.org/ke-automation-challenge/challenge-catalog/.gitea/PULL_REQUEST_TEMPLATE.md).
# This is a worked example for testing the local KEAC track end to end, not a
# real submission to the challenge. Generated by actually calling OntoChat's
# live public API — see generate_submission.py.

submission_name: ontochat-mock
team_or_group_name: bench4ke-internal-test
team_members: [N/A]
organisations: [N/A]
contact_person: N/A
contact_email: N/A
submission_number: 2  # of 3

challenge_task: Competency Question Generation
task_identifier: N/A
selected_track_or_input_modality: [scenario]
# "scenario" is the challenge-catalog term for user story / persona input,
# and is the exact mode name keac_eval.py uses — kept in sync deliberately.
# OntoChat's public API only exposes a scenario/user-story generator
# (/cq_generator) — it has no dataset-profiling or ontology-file input mode,
# so this submission only targets scenario-shaped benchmark groups.

submission_mode: API-based
# An accessible API is provided: OntoChat is a public Hugging Face Gradio
# Space (b289zhan/OntoChat). generate_submission.py calls its /cq_generator
# endpoint directly, after priming an OpenAI key into the session via
# /set_openai_api_key (OntoChat's backend calls GPT internally using that key).

files:
  - path: generate_submission.py
    purpose: Calls the live OntoChat API for a small subset of scenario-mode
      gold groups (3 of 16 available) and writes submission_output.csv.
      Reads the OpenAI key from the OPENAI_API_KEY environment variable —
      never hardcoded.
  - path: submission_output.csv
    purpose: Raw CQs actually returned by OntoChat for all 3 calls made (Amy,
      Paul, Linka; 15 rows, 5 per scenario), in the schema keac_eval.py
      expects. Only Amy and Paul (pure "scenario" mode) are within this
      submission's declared scope — see catalog_metadata and results_summary.
  - path: keac_results.csv
    purpose: Per-group KEAC metrics.
  - path: metadata.yaml
    purpose: This file.

catalog_metadata:
  submission_identifier: N/A
  system_identifier: OntoChat (b289zhan/OntoChat on Hugging Face Spaces)
  result_file: submission_output.csv
  metadata_file: metadata.yaml
  dataset_or_benchmark_split_identifier: >
    benchmarkdataset_full.csv, scenario-mode subset only (2 of 16 scenario
    groups sampled: two Polifonia personas, Amy and Paul). The Linka group was
    also called live for this demo, but is a "scenario+ontology" group —
    OntoChat never sees the ontology file, so it's excluded from this
    submission's declared scope rather than counted as an attempted group.
    Its raw output is still in submission_output.csv for transparency.
  applicable_metric_identifiers:
    - keac_coverage
    - keac_prec_mms
    - keac_acd
    - keac_verbosity_penalty
    - keac_final_score

system_and_model_information:
  system_name_and_version: OntoChat (public demo Space, version/commit not pinned by the Space itself)
  system_description: >
    Conversational ontology engineering assistant. The /cq_generator endpoint
    takes a free-text scenario/user-story and returns up to five competency
    questions on one semicolon-separated line.
  models_used: gpt-4o-mini (OntoChat's own fallback default; the Space itself
    does not report which model it used for a given call)
  model_availability:
    no_language_model_used: false
    openly_available_and_within_size_restrictions: false  # calls a closed OpenAI model
  model_parameter_count: N/A (closed model)
  random_seed: N/A (not exposed by the API)
  software_version_or_commit: N/A (hosted Space, no pinned commit surfaced via the API)
  required_hardware: None locally — inference runs on the hosted Space
  approximate_execution_time: ~10-20s per scenario call, 3 calls total

artifacts:
  source_code_repository: https://huggingface.co/spaces/b289zhan/OntoChat
  release_tag_or_commit: N/A
  api_endpoint_and_documentation: https://b289zhan-ontochat.hf.space (Gradio API, endpoint /cq_generator)
  container_image_or_environment_definition: N/A
  installation_and_execution_instructions: pip install gradio_client; see generate_submission.py
  paper_or_technical_report: N/A
  license: N/A

reproduction_instructions:
  commands: |
    OPENAI_API_KEY=... python keac/mock_submissions/api_based_ontochat/generate_submission.py
    python keac/keac_eval.py keac/mock_submissions/api_based_ontochat/submission_output.csv \
      --gold restapi/app/benchmarkdataset_full.csv \
      --modes "scenario" \
      --out keac/mock_submissions/api_based_ontochat/keac_results.csv
  additional_configuration: >
    Requires OPENAI_API_KEY in the environment (never committed to a file).
    --modes is set to "scenario" only, not "scenario+ontology" — OntoChat
    never receives the ontology file for the Linka group, so that group is
    outside this system's honestly declared modality even though it was
    called live and produced output. Declaring scope avoids both a misleadingly
    low score against unattempted benchmark groups, and an inflated one from
    counting a group whose full input the system never actually used.

results_summary:
  by_mode:
    scenario: "2/16 groups covered, mean final_score 0.0015"
  overall_final_score:
    unweighted_mean: 0.0015
    gold_size_weighted_mean: 0.0005
  excluded_from_scope:
    scenario+ontology: >
      1 group (Linka) was called live and produced output, but is excluded
      from this submission's scored/declared scope since it requires an
      ontology file OntoChat's API never received.
